[workspace]
resolver = "2"
members = ["crates/lxask-core", "crates/lxask-llm", "crates/lxask", "crates/lxask-py"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Aaron Thomas (arxhr007)"]
repository = "https://github.com/arxhr007/lxask"
rust-version = "1.80"

[workspace.dependencies]
lxask-core = { path = "crates/lxask-core" }
lxask-llm = { path = "crates/lxask-llm" }
fancy-regex = "0.19"
rusqlite = { version = "0.40", features = ["bundled"] }
half = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
