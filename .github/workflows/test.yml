name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-and-python:
    # the rules (lxask-core) and the Python tests that run them through lxask._core;
    # no model is needed and llama.cpp is not built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Rust core tests
        run: cargo test --release --manifest-path rust/Cargo.toml -p lxask-core
      - name: Build lxask._core
        run: |
          cargo build --release --manifest-path rust/crates/lxask-py/Cargo.toml --features pyo3/extension-module
          cp rust/target/release/lib_core.so src/lxask/_core.abi3.so
      - name: Python tests
        run: |
          python -m pip install --quiet pytest numpy
          PYTHONPATH=src python -m pytest -q

  program:
    # the lxask program's own tests (server, feedback, --share); builds llama.cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
      - name: Tools for llama.cpp
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libclang-dev
      - name: Program tests
        run: cargo test --release --manifest-path rust/Cargo.toml -p lxask

  macos:
    # releases have no macOS program: it is built from source (docs/install.md), so the
    # build, the program's tests and install.sh --program are what keep it working
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
      - name: Tests
        run: cargo test --release --manifest-path rust/Cargo.toml -p lxask-core -p lxask -p lxask-llm
      - name: Build
        run: cargo build --release --manifest-path rust/Cargo.toml -p lxask
      - name: install.sh without --program stops before downloading
        run: |
          if sh scripts/install.sh --no-serve 2>err.txt; then exit 1; fi
          grep -q 'releases have no macOS program' err.txt
      - name: install.sh --program, then a question
        env:
          LXASK_HOME: ${{ runner.temp }}/lxask
          LXASK_BIN: ${{ runner.temp }}/bin
        # the model and the rest from the latest release: a version change names one not made yet
        run: |
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/$GITHUB_REPOSITORY/releases/latest")
          LXASK_TAG=${latest##*/} sh scripts/install.sh --program rust/target/release/lxask --no-serve
          "$LXASK_BIN/lxask" --explain "du -sh --max-depth 1"
